<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery | 3A Services</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <section class="gallery-section">

        <img
            src="images/logo.png"
            alt="3A Services Logo"
            class="service-logo"
        >

        <h1 class="gallery-title">
            Our Gallery
        </h1>

        <p class="gallery-subtitle">
            Explore our projects, products, and installations.
        </p>

        <div class="gallery-grid">

             <img src="images/gallery/img1.jpg" alt="Gallery Image 1">
            <img src="images/gallery/img2.jpg" alt="Gallery Image 2">
            <img src="images/gallery/img3.jpg" alt="Gallery Image 3">
            <img src="images/gallery/img4.jpg" alt="Gallery Image 4">
            <img src="images/gallery/img5.jpg" alt="Gallery Image 5">
            <img src="images/gallery/img6.jpg" alt="Gallery Image 6">

        </div>

        <div class="gallery-buttons">

            <a href="index.html" class="btn primary-btn">
                Home
            </a>

            <button onclick="history.back()" class="btn secondary-btn">
                Back
            </button>

        </div>

    </section>

</body>

</html>
